const inlineAssets=html=>html.replace(/assets\/[a-zA-Z0-9_.-]+/g,path=>DEMO_ASSETS[path]||path);
(()=>{

const $=s=>document.querySelector(s), modal=$('#modal'), outlet=$('#app');
const navs=[['Operación',[['control','Vista general','grid'],['alertas','Alertas','sos'],['personas','Personas','people'],['operaciones','Operaciones','route']]],['Gestión comercial',[['servicios','Servicios','layers'],['solicitudes','Solicitudes','file'],['ingresos','Suscripciones','card']]]];
const navFlat=navs.flatMap(n=>n[1]);let view='',phoneTab='inicio',filter='Todas',q='',zoom=1,apos=[50,50],menu=false,helpFrom='',lastModal=null;
const pill=(label,color='mint')=>`<span class="pill ${color}">${esc(label)}</span>`;
const box=(icon,color,size=17)=>`<span class="iconbox ${color}">${ic(icon,size)}</span>`;
const btn=(label,act,id='',kind='')=>`<button type="button" class="btn ${kind}" data-act="${act}" data-id="${esc(id)}">${label}</button>`;
const square=(icon,label,act)=>`<button class="square" aria-label="${label}" title="${label}" data-act="${act}">${ic(icon,16)}</button>`;
const tlink=(txt,act,id='')=>`<button class="textbtn" data-act="${act}" data-id="${esc(id)}">${txt}</button>`;
const navButton=(v,html,cl='')=>`<button class="${cl}" data-nav="${v}">${html}</button>`;
const empty=(s)=>`<div class="empty">${ic('check',23)}${s}</div>`;
const head=(tag,title,desc,right='')=>`<div class="heading"><div><div class="eyebrow">${tag}</div><h1>${title}</h1><p>${desc}</p></div>${right}</div>`;
const ph=(icon,title,r='')=>`<div class="phead"><div class="title">${ic(icon,18)}<h2>${title}</h2></div>${r}</div>`;
const activeAlert=()=>openAlerts().find(x=>x.person===demoUser);
function route(){let key=location.hash.slice(1).split('/');view=(['app','actividad',...navFlat.map(x=>x[0])].includes(key[0])?key[0]:matchMedia('(max-width:760px)').matches?'app':'control');phoneTab=['inicio','servicios','pedidos','plan'].includes(key[1])?key[1]:'inicio';filter='Todas';q='';menu=false;if(modal.open)modal.close();render();}
function go(v){if(location.hash.slice(1)===v){route();return;}location.hash=v;}
function nav(){
return `<aside class="rail" aria-label="Menú principal">${navButton('control','<img src="assets/movisafe.svg" alt="Movisafe"><span class="edition">CTRL</span>','brand')}<nav class="navarea">${navs.map(([name,group])=>`<p class="navgroup">${name}</p>${group.map(([v,t,i])=>`<button class="navbtn ${view===v?'selected':''}" data-nav="${v}" ${view===v?'aria-current="page"':''} title="${t}">${ic(i,18)}<span class="navtxt">${t}</span>${v==='alertas'&&openAlerts().length?`<span class="num">${openAlerts().length}</span>`:''}</button>`).join('')}`).join('')}</nav><div class="railfoot"><button class="rail-demo" data-act="help">${ic('support',16)}<span>Guía de demostración</span></button><div class="identity"><span class="avatar">VC</span><span class="labels"><strong>Valeria Cruz</strong><small>Jefa de turno</small></span></div></div></aside>`;
}
function topbar(){
const title=view==='app'?'App del cliente':view==='actividad'?'Actividad':(navFlat.find(x=>x[0]===view)?.[1]||'Vista general');
return `<header class="top"><div class="crumb"><button class="hamb square" data-act="menu" aria-label="Abrir menú">${ic('menu',18)}</button><span class="crumbsection">Movisafe Control</span><span class="slash">/</span><strong>${title}</strong></div><div class="actions"><span class="header-label"><i class="statusdot"></i>Sesión demo</span><span class="vsep"></span>${navButton(view==='app'?'control':'app',ic(view==='app'?'monitor':'phone',16)+(view==='app'?'Centro de control':'App del cliente'),'btn appbtn')}</div></header>`;

function personDetail(index){const i=Number(index),n=users[i];if(!n)return;const a=openAlerts().find(x=>x.person===i);if(view==='app'){if(i===0&&a)alertDetail(a.id,true);else openDialog('Mi ubicación',`<p>Ubicación simulada en Polanco, Ciudad de México.</p>`);return;}openDialog('Ficha de persona',`<div class="row"><span class="avatar">${initials(n)}</span><h3>${n}</h3></div><div class="detailgrid">${detail('Zona de referencia',areas[i%8])}${detail('Seguimiento',i===0&&!state.tracking?'En pausa':'Ubicación simulada activa')}${detail('Estado',a?kinds[a.kind].name:'Sin alerta abierta')}${detail('Plan',i===0?getPlan().name:'Empresa')}</div>${a?btn('Abrir alerta','alert',a.id,'solid'):''}`);}
function serviceDetail(id){const s=getService(id);if(!s)return;const dt=new Date(now()+86400000);const date=dt.toLocaleDateString('sv-SE',{timeZone:'America/Mexico_City'}),today=new Date().toLocaleDateString('sv-SE',{timeZone:'America/Mexico_City'});
openDialog(s.name,`<div class="row">${box(s.icon,'mint')}${pill(s.group,'neutral')}</div><p style="margin-top:12px">${s.desc}</p><div class="bignotice">${prices(s)}${s.price?' · Precio de referencia':''}</div><form data-form="service" data-id="${id}">${view!=='app'?field('Cliente','person',select('person',users.map((n,i)=>[String(i),n]),'0')):''}<div class="fieldrow">${field('Fecha deseada','when',`<input id="when" name="when" type="date" min="${today}" value="${date}" required>`)}${field('Personas','qty',numInput('qty',1,1,5000))}</div>${field('Zona del servicio','place','<input id="place" name="place" required maxlength="80" placeholder="Ej. Polanco, CDMX">')}${field('Detalles (opcional)','note','<textarea id="note" name="note" maxlength="400" placeholder="Describe el servicio que necesitas"></textarea>')}<p class="tiny">Solicitud de demostración. Utiliza datos ficticios.</p><div class="dialogactions"><button class="btn solid">${ic('send',15)} Solicitar cotización</button></div></form>`);}
function requestDetail(id){const r=state.requests.find(x=>x.id===id);if(!r)return;const s=getService(r.service),client=view==='app';if(client&&r.person!==0)return;
let tail='';
if(r.status==='Nueva'&&!client)tail=`<form data-form="quote" data-id="${id}"><div class="fieldrow">${field('Precio total (MXN)','total',numInput('total',s.price||'',1,10000000,'.01'))}${field('Anticipo (%)','deposit',numInput('deposit',50,1,100))}</div><div class="dialogactions"><button class="btn solid">Enviar cotización demo</button></div></form>`;
if(r.status==='Nueva'&&client)tail=`<div class="bignotice">Tu solicitud está en la bandeja comercial de Movisafe.</div>`;
if(r.status!=='Nueva'){const amount=Math.round(r.total*r.deposit)/100;tail=`<div class="bignotice"><div class="quotevalue">${money(r.total)} MXN</div>${r.status==='Confirmada'?'Anticipo registrado':'Anticipo para confirmar'} · ${r.deposit}% · ${money(amount)} MXN<br>Saldo tras el anticipo · ${money(Math.round((r.total-amount)*100)/100)} MXN</div>${r.status==='Cotizada'?(client?btn('Aceptar y simular anticipo','accept',r.id,'solid'):`<p>La cotización está disponible para el cliente.</p>${r.person===0?navButton('app/pedidos','Ver en la app del cliente','btn'):btn('Simular aceptación del cliente','accept',r.id)}`):'<p>Servicio confirmado. La misión figura en Operaciones.</p>'}`;}
if(!client&&r.status!=='Nueva')tail+=`<div class="dialogactions">${btn('Copiar cotización para WhatsApp','copyquote',id)}</div>`;
openDialog(s.name,`<div class="row">${pill(r.status,level(r.status))}<span class="tiny mono end">${r.id}</span></div><div class="detailgrid">${detail('Cliente',users[r.person])}${detail('Fecha',r.when)}${detail('Personas',r.qty)}${detail('Zona',r.place)}</div>${r.note?`<p>${esc(r.note)}</p>`:''}${tail}`);}
async function copyQuote(id){
 const r=state.requests.find(v=>v.id===id);if(!r||!r.total)return;
 const copy='Cotización de demostración Movisafe · '+r.id+'\n'+getService(r.service).name+' · '+r.when+' · '+r.place+'\nTotal: '+money(r.total)+' MXN. Anticipo del '+r.deposit+'%: '+money(Math.round(r.total*r.deposit)/100)+' MXN.\nPuedes revisar la propuesta en Mis solicitudes de la app Movisafe.';
 try{await navigator.clipboard.writeText(copy);toast('Cotización copiada');}catch{openDialog('Copiar cotización',field('Texto para compartir','sharetext','<textarea id="sharetext" readonly rows="6">'+esc(copy)+'</textarea>'));document.querySelector('#sharetext').select();}
}
function confirmDeposit(id){const r=state.requests.find(x=>x.id===id&&x.status==='Cotizada');if(!r)return;const amount=Math.round(r.total*r.deposit)/100;openDialog('Confirmar anticipo simulado',`<p>${getService(r.service).name} para ${users[r.person]}.</p><div class="bignotice"><div class="quotevalue">${money(amount)} MXN</div>${r.deposit}% del total de ${money(r.total)} MXN.</div><p>Esta simulación confirma la reserva y crea una misión para el equipo. No se realiza ningún cargo.</p><div class="dialogactions">${btn('Volver','request',id)}${btn('Confirmar simulación','paid',id,'solid')}</div>`);}
function missionDetail(id){const m=state.missions.find(x=>x.id===id);if(!m)return;openDialog(getService(m.service).name,`${pill(m.status,level(m.status))}<div class="detailgrid">${detail('Folio',m.id)}${detail('Cliente',users[m.person])}${detail('Lugar',m.place)}${detail('Responsable',m.operator||'Por asignar')}${m.when?detail('Fecha',m.when):''}</div>${m.status==='Programado'?`<form data-form="startmission" data-id="${id}">${field('Responsable de la misión','operator',select('operator',operators,operators[0]))}<div class="dialogactions"><button class="btn solid">Iniciar servicio</button></div></form>`:m.status==='En curso'?btn('Finalizar servicio','finishmission',id,'solid'):''}`);}
function planDetail(id){const p=plans.find(x=>x.id===id);if(!p)return;openDialog('Suscripción '+p.name,`<p>Cuenta de demostración de Andrea Salas.</p><div class="bignotice"><div class="quotevalue">${money(p.price)} MXN / mes</div>${p.desc}.</div><p>Se actualizarán el plan de Andrea y el ingreso recurrente de la central. No se realizará ningún cobro.</p><div class="dialogactions">${btn('Cancelar','close')}${btn('Activar plan demo','plan-commit',id,'solid')}</div>`);}
function showHelp(){openDialog('Guía de demostración',`<ol class="helpsteps"><li>Abre <b>App del cliente</b>. Mantén presionado SOS durante dos segundos.</li><li>En <b>Alertas</b>, toma el caso, asigna un operador y registra su resolución.</li><li>En la app, entra a <b>Servicios</b> y solicita un traslado, protección o capacitación.</li><li>En <b>Solicitudes</b>, prepara la cotización. En la app, el cliente acepta y simula el anticipo.</li><li>La reserva aparece en <b>Operaciones</b>. Los planes mensuales y el ingreso recurrente se consultan en <b>Suscripciones</b>.</li></ol><p>Ambas vistas comparten datos en este navegador. Las ubicaciones y los cobros son simulados.</p><div class="dialogactions">${btn('Reiniciar demo','resetask')}${navButton('app','Abrir app del cliente','btn solid')}</div>`);}


function triggerSOS(){let a=activeAlert();if(a){alertDetail(a.id,true);return;}a={id:'AL-'+state.next++,person:0,kind:'sos',status:'Nueva',operator:'',time:now(),zone:state.tracking?'Polanco':'Ubicación en pausa'};state.alerts.unshift(a);record('sos','Botón de pánico activado',0,a.zone,a.id);save();if(modal.open)modal.close();render();toast('SOS simulado recibido en la central');}
function action(act,id,el){
if(act==='checkin'){record('check','Check-in confirmado por Andrea',0,'Trayecto simulado');save();render();toast('Check-in recibido por la central');return;}
if(act==='copyquote'){copyQuote(id);return;}
if(act==='menu'){menu=!menu;$('.shell').classList.toggle('navopen',menu);return;}
if(act==='close'){modal.close();return;}
if(act==='help'){showHelp();return;}
if(act==='filter'){filter=id;render();return;}
if(act==='client-services'){go('app/servicios');return;}
if(act==='sos'){if(now()-heldAt<650)return;openDialog('Activar SOS de demostración',`<p>Se creará una alerta para Andrea en el centro de monitoreo.</p><div class="dialogactions">${btn('Cancelar','close')}${btn('Activar SOS demo','triggersos','','danger')}</div>`);return;}
if(act==='triggersos'){triggerSOS();return;}
if(act==='myalert'){if(activeAlert())alertDetail(activeAlert().id,true);return;}
if(act==='alert'){alertDetail(id,view==='app'&&el?.closest('.mapview')&&!el?.closest('.clientaside'));return;}
if(act==='person'){personDetail(id);return;}
if(act==='service'){serviceDetail(id);return;}
if(act==='request'){requestDetail(id);return;}
if(act==='accept'){confirmDeposit(id);return;}
if(act==='mission'){missionDetail(id);return;}
if(act==='chooseplan'){planDetail(id);return;}
if(['zoom+','zoom-','center'].includes(act)){zoom=act==='center'?1:Math.max(1,Math.min(2.5,zoom+(act==='zoom+'?.5:-.5)));if(act==='center')apos=[50,50];render();return;}
if(act==='tracking'){if(state.tracking&&state.trip){openDialog('Pausar seguimiento',`<p>Al pausar la ubicación también finalizará tu trayecto simulado.</p><div class="dialogactions">${btn('Cancelar','close')}${btn('Pausar ubicación','pause-confirm','','solid')}</div>`);return;}state.tracking=!state.tracking;record('pin',state.tracking?'Ubicación compartida':'Ubicación en pausa',0,state.tracking?'Polanco':'En pausa');save();render();toast(state.tracking?'Ubicación simulada compartida':'Seguimiento en pausa');return;}
if(act==='pause-confirm'){state.tracking=false;state.trip=false;record('pin','Trayecto finalizado y ubicación en pausa',0,'En pausa');save();done('Seguimiento en pausa');return;}
if(act==='trip'){if(!state.trip&&!state.tracking){openDialog('Compartir durante el trayecto',`<p>Al iniciar el trayecto autorizas que la central vea tu ubicación simulada.</p><div class="dialogactions">${btn('Cancelar','close')}${btn('Compartir e iniciar','consenttrip','','solid')}</div>`);return;}state.trip=!state.trip;if(state.trip)state.tripStarted=now();record('route',state.trip?'Trayecto seguro iniciado':'Trayecto finalizado',0,'Polanco');save();render();toast(state.trip?'Trayecto iniciado':'Trayecto finalizado');return;}
if(act==='consenttrip'){state.tracking=true;state.trip=true;state.tripStarted=now();record('route','Trayecto seguro iniciado',0,'Polanco');save();done('Trayecto iniciado');return;}
if(act==='paid'){const r=state.requests.find(x=>x.id===id);if(!r||r.status!=='Cotizada')return;r.status='Confirmada';r.paid=Math.round(r.total*r.deposit)/100;state.missions.unshift({id:'OP-'+state.next++,ref:r.id,person:r.person,service:r.service,place:r.place,when:r.when,operator:'',status:'Programado'});record('wallet','Anticipo simulado confirmado',r.person,r.place,r.id);save();done('Anticipo simulado. Servicio programado.');return;}
if(act==='plan-commit'){if(!plans.some(p=>p.id===id))return;state.plan=id;record('card','Suscripción '+getPlan().name+' activada',0,'Polanco');save();done('Suscripción de demostración actualizada');return;}
if(act==='finishmission'){const m=state.missions.find(x=>x.id===id&&x.status==='En curso');if(!m)return;m.status='Finalizado';record('check','Servicio finalizado',m.person,m.place,m.id);save();done('Servicio finalizado');return;}
if(act==='resetask'){openDialog('Reiniciar demostración',`<p>Volverás al escenario inicial. Se eliminarán únicamente los cambios de esta demo en el navegador.</p><div class="dialogactions">${btn('Cancelar','close')}${btn('Reiniciar demo','reset','','danger')}</div>`);return;}
if(act==='reset'){state=initial();save();modal.close();go('control');render();toast('Escenario inicial restaurado');}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-nav],[data-act]');if(!el)return;if(el.dataset.nav){if(modal.open)modal.close();go(el.dataset.nav);return;}action(el.dataset.act,el.dataset.id,el);});
modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close();}});
document.addEventListener('input',e=>{if(e.target.id==='search'){q=e.target.value;render();const inp=$('#search');inp.focus();inp.setSelectionRange(q.length,q.length);}});
document.addEventListener('submit',e=>{
const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();if(!f.reportValidity())return;const data=Object.fromEntries(new FormData(f)),id=f.dataset.id,kind=f.dataset.form;
if(kind==='assignalert'||kind==='resolve'){const a=state.alerts.find(x=>x.id===id);if(!a)return;if(kind==='assignalert'&&a.status==='Nueva'&&operators.includes(data.operator)){a.status='En atención';a.operator=data.operator;record('headset','Alerta asignada a '+a.operator,a.person,a.zone,a.id);}else if(kind==='resolve'&&a.status==='En atención'&&data.note.trim()){a.status='Resuelta';a.note=data.note.trim();a.closed=now();record('check','Alerta resuelta',a.person,a.zone,a.id);}else return;save();done(kind==='resolve'?'Alerta resuelta':'Operador asignado');return;}
if(kind==='service'){const place=data.place.trim();if(!place){f.elements.place.focus();return;}const person=view==='app'?0:Number(data.person||0);if(!users[person]||!getService(id))return;const r={id:'SV-'+state.next++,person,service:id,place,qty:Number(data.qty),when:data.when,note:(data.note||'').trim(),status:'Nueva',total:0,paid:0,deposit:50,time:now()};state.requests.unshift(r);record('file','Solicitud de '+getService(id).name,person,place,r.id);save();modal.close();go(view==='app'?'app/pedidos':'solicitudes');toast('Solicitud recibida · '+r.id);return;}
if(kind==='quote'){const r=state.requests.find(x=>x.id===id&&x.status==='Nueva');if(!r)return;const total=Number(data.total),deposit=Number(data.deposit);if(!Number.isFinite(total)||total<=0||deposit<1||deposit>100)return;r.total=total;r.deposit=deposit;r.status='Cotizada';record('file','Cotización enviada',r.person,r.place,r.id);save();done('Cotización disponible para el cliente');return;}
if(kind==='startmission'){const m=state.missions.find(x=>x.id===id&&x.status==='Programado');if(!m||!operators.includes(data.operator))return;m.operator=data.operator;m.status='En curso';record('case','Servicio iniciado',m.person,m.place,m.id);save();done('Misión en curso');}
});
let holdTimer=null,heldAt=0,holdTarget;
function stopHold(){clearTimeout(holdTimer);holdTimer=null;holdTarget?.classList.remove('holding');holdTarget=null;}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('#sos[data-act="sos"]');if(!b||e.button!==0)return;stopHold();holdTarget=b;b.classList.add('holding');try{b.setPointerCapture(e.pointerId);}catch{}holdTimer=setTimeout(()=>{heldAt=now();stopHold();triggerSOS();},2000);});
document.addEventListener('pointermove',e=>{if(!holdTarget)return;const r=holdTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)stopHold();});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>document.addEventListener(ev,stopHold));
window.addEventListener('blur',stopHold);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopHold();});
document.addEventListener('contextmenu',e=>{if(e.target.closest('#sos'))e.preventDefault();});
document.addEventListener('click',e=>{if(zoom<=1||!e.target.matches('.mapraster,.geosurface,.maplines'))return;const m=e.target.closest('.mapview'),r=m.getBoundingClientRect();apos=[100*(e.clientX-r.left)/r.width,100*(e.clientY-r.top)/r.height];render();});
window.addEventListener('storage',e=>{if(e.key===key){state=loadState();if(modal.open)modal.close();render();}});
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0);});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&menu){menu=false;$('.shell').classList.remove('navopen');}});
setInterval(()=>{if(!state.trip||document.hidden)return;const [x,y]=tripPoint();document.querySelectorAll('.marker[data-person="0"]').forEach(m=>{m.style.left=x+'%';m.style.top=y+'%';});},1200);
save();route();


})();
</script></body></html>
